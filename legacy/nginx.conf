server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

  # liveness / readiness probe target
  location = /healthz {
    default_type text/plain;
    return 200 "ok\n";
  }

  # generated at container start from env vars (see docker-entrypoint.d/40-config.sh)
  location = /config.js {
    alias /tmp/config.js;
    default_type application/javascript;
    add_header Cache-Control "no-store";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
